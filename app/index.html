<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>みんなと家計簿</title>
  <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151514" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="みんなと家計簿">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar"><h1 id="title">入力</h1></header>
  <main id="view"></main>
  <nav class="tabs" aria-label="画面の切り替え">
    <button data-tab="input" class="on"><span class="ti">✎</span>入力</button>
    <button data-tab="list"><span class="ti">☰</span>一覧</button>
    <button data-tab="summary"><span class="ti">◔</span>集計</button>
    <button data-tab="ranking"><span class="ti">♛</span>ランキング</button>
    <button data-tab="settings"><span class="ti">⚙</span>設定</button>
  </nav>
  <div id="sheet-back" hidden></div>
  <section id="sheet" hidden aria-modal="true" role="dialog"></section>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="skin-banner" role="status" aria-live="polite"></div>
  <script src="store.js"></script>
  <script src="accounts.js"></script>
  <script src="charts.js"></script>
  <script src="ranking.js"></script>
  <script src="skins.js"></script>
  <script src="app.js"></script>
</body>
</html>
